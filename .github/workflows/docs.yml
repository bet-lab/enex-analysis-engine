name: Build and Deploy Documentation

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".gitmodules"
      - ".github/workflows/docs.yml"
  pull_request:
    branches:
      - main
    paths:
      - "docs/**"
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".gitmodules"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Public PR checks use isolated hosted runners; trusted events retain ml-main.
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || '["self-hosted", "ml-main"]') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: |
          uv sync --extra docs --locked

      - name: Build documentation
        run: |
          cd docs
          uv run sphinx-build -b html source build

      - name: Upload built documentation
        uses: actions/upload-artifact@v7
        with:
          name: documentation-html
          path: docs/build
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
    runs-on: [self-hosted, ml-main]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Download built documentation
        uses: actions/download-artifact@v8
        with:
          name: documentation-html
          path: docs/build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/build
          force_orphan: true
